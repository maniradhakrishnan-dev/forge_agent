[project]
name = "forgeagent"
version = "0.1.0"
description = "Ground-up multi-agent system for mechanical CAD design and assembly verification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cadquery>=2.2.0",
    "pydantic>=2.0.0",
    "mcp>=1.0.0",
    "httpx>=0.24.0",
    "python-dotenv>=1.0.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orchestrator", "tools", "skills", "eval"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live: marks tests calling external LLM APIs (deselect with -m 'not live')"
]
